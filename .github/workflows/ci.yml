name: '✅ ci'

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ✅ verify
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      # `npm ci` also runs `prepare` (bob build), so the library is built here.
      - name: 📦 install
        run: npm ci

      - name: 🔎 typecheck
        run: npm run typecheck

      - name: 🧹 lint
        run: npm run lint

      # Mounts the example against the real src/index.tsx with a stubbed native
      # module, so a library that throws on import fails here rather than on a
      # device.
      - name: 🧪 test
        run: npm test --workspace AppsOnAirPushExample

      # Rebuilds from a clean lib/ so a stale artifact cannot mask a build break.
      - name: 🏗️ build
        run: npm run clean && npm run prepare

      # Fails the job if the tarball would ship without the native sources --
      # the podspec, the Android module or the iOS bridge going missing from
      # `files` is invisible until someone installs the package.
      # Two guards, because one is not enough.
      #
      # --ignore-scripts is meant to stop `npm pack` running `prepare`, since bob
      # writes progress to stdout and that lands in pack.json ahead of the JSON.
      # It works on npm 11, but npm 10 -- which is what Node 20 ships, and what
      # this job actually runs -- ignores the flag for pack and runs `prepare`
      # anyway. So the flag alone is not portable across npm versions.
      #
      # Hence the sed: npm pretty-prints the --json array starting with a bare
      # `[` line, while every bob line is prefixed (ℹ / ✔). Slicing from that
      # line forward yields valid JSON whether or not `prepare` ran. The build
      # step above already produced lib/, so a rebuild here is only wasted time,
      # never wrong output.
      - name: 📋 verify package contents
        run: |
          npm pack --dry-run --json --ignore-scripts | sed -n '/^\[$/,$p' > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const required = [
              'appsonair-react-native-apppush.podspec',
              'react-native.config.js',
              'android/build.gradle',
              'android/src/main/java/com/appsonairreactnativeapppush/AppsonairReactNativeApppushModuleImpl.kt',
              'ios/AppsonairReactNativeApppush.mm',
              'ios/AppsonairReactNativeApppushImpl.swift',
              'lib/commonjs/index.js',
              'lib/module/index.js',
              'lib/typescript/commonjs/src/index.d.ts',
              'LICENSE',
              'README.md',
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error('missing from the npm tarball:\n  ' + missing.join('\n  '));
              process.exit(1);
            }
            console.log(files.length + ' files in the tarball, all required paths present');
          "

  android:
    name: 🤖 android
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: ☕ jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 install
        run: npm ci

      # Compiles the Kotlin bridge against the published Push SDK on both
      # architectures -- the part most likely to break on an SDK bump.
      - name: 🤖 assemble the library (new arch)
        working-directory: example/android
        run: ./gradlew :appsonair-react-native-apppush:assembleRelease -PnewArchEnabled=true

      - name: 🤖 assemble the library (old arch)
        working-directory: example/android
        run: ./gradlew :appsonair-react-native-apppush:assembleRelease -PnewArchEnabled=false

      # R8 only ever runs in an application build -- an AAR is published
      # unminified -- so a library stripped by a consumer's release build cannot
      # be caught by assembling the library. The example's release build turns
      # minification on for exactly this reason.
      #
      # No secrets needed: it is signed with the committed debug keystore, and
      # the Google Services plugin is applied only when google-services.json is
      # present, which it is not here. The APK cannot receive a push without one,
      # but R8 runs over the same code either way. One ABI keeps it quick; R8 is
      # architecture-independent.
      - name: 🤖 assemble the example app (release, R8 on)
        working-directory: example/android
        run: ./gradlew :app:assembleRelease -PnewArchEnabled=true -PreactNativeArchitectures=arm64-v8a

  ios:
    name: 🍎 ios (${{ matrix.arch.name }} arch)
    # Pinned, not macos-latest: this has to match the Xcode the team develops on,
    # because the Podfile's post_install works around Xcode 26 specifically
    # (TOOLCHAIN_DIR resolves to the Metal toolchain there). An older image would
    # build green without ever exercising the path that workaround exists for.
    runs-on: macos-26
    strategy:
      # Both architectures are reported even when one fails -- the two link
      # differently and knowing it is only one of them is most of the diagnosis.
      fail-fast: false
      matrix:
        arch:
          - { name: new, rct: '1' }
          - { name: old, rct: '0' }
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📦 install
        run: npm ci

      # Podfile.lock is not tracked, so this resolves against the trunk exactly
      # as a host app's first install does -- which is what makes the version
      # pins in the podspec (AppsOnAir-AppPush, and the AppsOnAir-Core floor)
      # part of what CI actually checks. --repo-update guards against a stale
      # CDN shard for a recently published version.
      #
      # iOS selects the architecture at pod install time through this env var;
      # there is no gradle.properties equivalent to flip.
      - name: 🍎 pod install
        working-directory: example/ios
        env:
          RCT_NEW_ARCH_ENABLED: ${{ matrix.arch.rct }}
        run: pod install --repo-update

      # Compiles the Swift and ObjC++ halves of the bridge against the published
      # SDK -- the counterpart to the Android job, and the part that a Codegen
      # spec change or an SDK bump breaks first.
      #
      # The example app target is deliberately ObjC-only (AppDelegate.mm, main.m),
      # which is the layout that needs the Swift runtime search paths the Podfile's
      # post_install adds. Building it here is what keeps that workaround honest;
      # it fails on the old arch first, hence both matrix legs.
      #
      # Release, to match the Android job: it runs the Hermes bundling phase, so a
      # library that breaks the release JS bundle fails here rather than on a device.
      # A simulator destination needs no signing and no secrets.
      - name: 🍎 build the example app (release)
        working-directory: example/ios
        run: |
          # Logged so a runner-image bump that moves Xcode is visible in the job
          # output rather than showing up as an unexplained compile failure.
          xcodebuild -version
          xcodebuild build \
            -workspace AppsOnAirPushExample.xcworkspace \
            -scheme AppsOnAirPushExample \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
