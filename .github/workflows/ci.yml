name: '✅ ci'

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ✅ verify
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      # `npm ci` also runs `prepare` (bob build), so the library is built here.
      - name: 📦 install
        run: npm ci

      - name: 🔎 typecheck
        run: npm run typecheck

      - name: 🧹 lint
        run: npm run lint

      # Mounts the example against the real src/index.tsx with a stubbed native
      # module, so a library that throws on import fails here rather than on a
      # device.
      - name: 🧪 test
        run: npm test --workspace AppsOnAirPushExample

      # Rebuilds from a clean lib/ so a stale artifact cannot mask a build break.
      - name: 🏗️ build
        run: npm run clean && npm run prepare

      # Fails the job if the tarball would ship without the native sources --
      # the podspec, the Android module or the iOS bridge going missing from
      # `files` is invisible until someone installs the package.
      - name: 📋 verify package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path);
            const required = [
              'appsonair-react-native-push.podspec',
              'react-native.config.js',
              'android/build.gradle',
              'android/src/main/java/com/appsonairreactnativepush/AppsonairReactNativePushModuleImpl.kt',
              'ios/AppsonairReactNativePush.mm',
              'ios/AppsonairReactNativePushImpl.swift',
              'lib/commonjs/index.js',
              'lib/module/index.js',
              'lib/typescript/commonjs/src/index.d.ts',
              'LICENSE',
              'README.md',
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error('missing from the npm tarball:\n  ' + missing.join('\n  '));
              process.exit(1);
            }
            console.log(files.length + ' files in the tarball, all required paths present');
          "

  android:
    name: 🤖 android
    runs-on: ubuntu-latest
    steps:
      - name: 📚 checkout
        uses: actions/checkout@v4

      - name: 🟢 node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: ☕ jdk
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 install
        run: npm ci

      # Compiles the Kotlin bridge against the published Push SDK on both
      # architectures -- the part most likely to break on an SDK bump.
      - name: 🤖 assemble the library (new arch)
        working-directory: example/android
        run: ./gradlew :appsonair-react-native-push:assembleRelease -PnewArchEnabled=true

      - name: 🤖 assemble the library (old arch)
        working-directory: example/android
        run: ./gradlew :appsonair-react-native-push:assembleRelease -PnewArchEnabled=false

      # R8 only ever runs in an application build -- an AAR is published
      # unminified -- so a library stripped by a consumer's release build cannot
      # be caught by assembling the library. The example's release build turns
      # minification on for exactly this reason.
      #
      # No secrets needed: it is signed with the committed debug keystore, and
      # the Google Services plugin is applied only when google-services.json is
      # present, which it is not here. The APK cannot receive a push without one,
      # but R8 runs over the same code either way. One ABI keeps it quick; R8 is
      # architecture-independent.
      - name: 🤖 assemble the example app (release, R8 on)
        working-directory: example/android
        run: ./gradlew :app:assembleRelease -PnewArchEnabled=true -PreactNativeArchitectures=arm64-v8a
