# Keeps Yarn 3+/Corepack on a real node_modules tree. React Native's Metro and
# the Gradle/CocoaPods autolinkers all resolve through node_modules, so Yarn's
# default PnP linker breaks the example app.
#
# Unlike the sibling AppLink / AppSync / AppRemark wrappers, this package does
# not pin `packageManager: yarn@3.6.1` in package.json. Those repos vendor
# .yarn/releases/yarn-3.6.1.cjs, which is what lets Yarn 1 delegate to it; with
# the pin but no vendored binary, `yarn install` hard-errors on Yarn 1. Without
# the pin, npm and Yarn 1 both work and Yarn 3+ still reads this file. Add the
# pin back if you also vendor the release binary.
nodeLinker: node-modules
nmHoistingLimits: workspaces
