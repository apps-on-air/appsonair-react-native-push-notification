buildscript {
  // Buildscript is evaluated before everything else, so getExtOrDefault is not available yet.
  def kotlin_version = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion")
    : project.properties["AppsonairReactNativeApppush_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Runs Codegen to generate NativeAppsonairApppushSpec (New Architecture only).
if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name)
    ? rootProject.ext.get(name)
    : project.properties["AppsonairReactNativeApppush_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name)
    ? rootProject.ext.get(name)
    : (project.properties["AppsonairReactNativeApppush_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in AGP 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.appsonairreactnativeapppush"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    // Read by AppsonairReactNativeApppushPackage to register a TurboModule or a legacy module.
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    // Required from AGP 8 onwards, where BuildConfig generation is off by default.
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"

    // WORKAROUND (still needed with SDK 1.0.2-beta): the Android Push SDK is built
    // with Kotlin 2.2, which the Kotlin versions React Native uses (1.9-2.1) can't
    // read ("compiled with an incompatible version of Kotlin"). Remove this and the
    // kotlin-stdlib pin below once the SDK sets languageVersion/apiVersion to "1.9".
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }

  // Both folders define the same module class, so only one may be compiled.
  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += ["src/newarch/java"]
      } else {
        java.srcDirs += ["src/oldarch/java"]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71 this resolves from the local maven repo; for > 0.71 the React
  // Gradle plugin rewrites it to com.facebook.react:react-android:$version.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Part of the Kotlin workaround above: the SDK pulls in kotlin-stdlib 2.2.10,
  // which would break the host app's own Kotlin compile, so pin it to the host's
  // version. Risk: a newer stdlib API used by the SDK would fail at runtime.
  implementation("org.jetbrains.kotlin:kotlin-stdlib") {
    version { strictly kotlin_version }
  }

  // Native Push SDK from JitPack (the host app needs maven { url 'https://jitpack.io' }).
  // Override via AppsonairReactNativeApppush_pushSdkCoordinate in gradle.properties.
  implementation getExtOrDefault("pushSdkCoordinate")
}
