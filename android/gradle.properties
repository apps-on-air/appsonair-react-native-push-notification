AppsonairReactNativePush_kotlinVersion=1.9.24
AppsonairReactNativePush_minSdkVersion=24
AppsonairReactNativePush_targetSdkVersion=34
AppsonairReactNativePush_compileSdkVersion=35

# minSdk 24 is inherited, not chosen: the native Push SDK requires AppsOnAir Core,
# which is minSdk 24. Lowering this here will fail the manifest merge.

# The native Push SDK coordinate, served by JitPack from the tag of the same name --
# the `v` prefix is the tag's, not a different release. Overridable from the host app's
# gradle.properties so a team can point at a local build or a private repo without
# patching this file.
AppsonairReactNativePush_pushSdkCoordinate=com.github.apps-on-air:appsonair-android-push-notification:v0.0.2-alpha
