apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// google-services.json is per-developer and not committed, so the plugin is only
// applied when you've added one here (example/android/app/).
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn(
        "\n" +
        "================================================================\n" +
        " AppsOnAirPushExample: google-services.json NOT FOUND\n" +
        " Expected at: ${projectDir}/google-services.json\n" +
        "\n" +
        " The app will build and install, but AppsOnAirPush.initialize()\n" +
        " will fail at runtime with:\n" +
        "   \"Default FirebaseApp is not initialized in this process\"\n" +
        "\n" +
        " Fix: Firebase console -> add an Android app with package name\n" +
        " com.appsonairpushexample -> download google-services.json here.\n" +
        "================================================================"
    )
}

react {
    // npm workspaces hoist react-native to the repo root, so resolve package paths through Node.
    def resolvePackageDir = { String name ->
        providers.exec {
            commandLine(
                "node", "--print",
                "require('path').dirname(require.resolve('${name}/package.json', { paths: ['${rootDir}'] }))"
            )
        }.standardOutput.asText.get().trim()
    }
    reactNativeDir = file(resolvePackageDir("react-native"))
    codegenDir = file(resolvePackageDir("@react-native/codegen"))
    cliFile = file("${resolvePackageDir('react-native')}/cli.js")

    // The plugin can't find the hoisted hermesc, so point at it for this OS.
    def hermescOsName = System.getProperty("os.name").toLowerCase()
    def hermescOsBin =
        hermescOsName.contains("windows") ? "win64-bin" :
        hermescOsName.contains("mac") ? "osx-bin" : "linux64-bin"
    hermesCommand = "${resolvePackageDir('react-native')}/sdks/hermesc/${hermescOsBin}/hermesc"

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.appsonairpushexample"
    defaultConfig {
        applicationId "com.appsonairpushexample"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
